{#
  AI suggestion box.
  Expects: ai_url, ai_kind, ai_fields (comma-separated input ids),
           ai_target (textarea id), ai_title, ai_help, ai_button
#}
<div class="ai-panel space-y-3"
     data-ai-panel data-url="{{ ai_url }}" data-kind="{{ ai_kind }}"
     data-fields="{{ ai_fields }}" data-target="{{ ai_target }}">

  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <p class="text-sm font-semibold" style="color: var(--forest);">{{ ai_title }}</p>
      <p class="text-xs" style="color: var(--color-muted);">{{ ai_help }}</p>
    </div>
    <button type="button" class="btn-outline" data-ai-run>{{ ai_button }}</button>
  </div>

  <div class="hidden space-y-2" data-ai-suggestion>
    <label class="block text-xs font-semibold" style="color: var(--forest);">
      AI suggestion — check it and edit if needed
    </label>
    <textarea class="input" rows="4" data-ai-text></textarea>
    <div class="flex gap-2">
      <button type="button" class="btn-primary" data-ai-accept>Use this</button>
      <button type="button" class="btn-secondary" data-ai-discard>Discard</button>
    </div>
  </div>

  <p class="text-xs" style="color: var(--color-muted);" data-ai-status aria-live="polite"></p>
</div>
