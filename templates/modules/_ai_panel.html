{# AI suggestion box. Expects: ai_url, ai_kind, ai_fields (comma-separated input ids), ai_target (textarea id), ai_title, ai_help, ai_button #}
<div class="rounded-xl border border-indigo-100 bg-indigo-50/60 p-4 space-y-3"
     data-ai-panel data-url="{{ ai_url }}" data-kind="{{ ai_kind }}" data-fields="{{ ai_fields }}" data-target="{{ ai_target }}">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <p class="text-sm font-semibold text-indigo-900">{{ ai_title }}</p>
      <p class="text-xs text-indigo-900/70">{{ ai_help }}</p>
    </div>
    <button type="button" class="btn-secondary" data-ai-run>{{ ai_button }}</button>
  </div>
  <div class="hidden space-y-2" data-ai-suggestion>
    <label class="block text-xs font-semibold text-slate-700">AI suggestion (check it and edit if needed)</label>
    <textarea class="input" rows="4" data-ai-text></textarea>
    <div class="flex gap-2">
      <button type="button" class="btn-primary" data-ai-accept>Use this</button>
      <button type="button" class="btn-secondary" data-ai-discard>Discard</button>
    </div>
  </div>
  <p class="text-xs text-slate-600" data-ai-status aria-live="polite"></p>
</div>
