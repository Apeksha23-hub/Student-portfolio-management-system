{# Sidebar with links to every profile module. Expects: modules, active #}
<nav class="card p-2 lg:sticky lg:top-24" aria-label="Profile sections">
  <a href="{{ url_for('profile.edit_profile') }}"
     class="sidebar-link {% if active == 'personal' %}active{% endif %}">
    Personal profile
  </a>
  {% for name, m in modules.items() %}
    <a href="{{ url_for('profile.list_items', module_name=name) }}"
       class="sidebar-link {% if active == name %}active{% endif %}">
      {{ m.title }}
    </a>
  {% endfor %}
</nav>
