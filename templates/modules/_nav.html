{# Sidebar with links to every profile module. Expects: modules, active #}
<nav class="card p-2 lg:sticky lg:top-24" aria-label="Profile sections">
  <a href="{{ url_for('profile.edit_profile') }}"
     class="block px-3 py-2 rounded-lg text-sm font-medium {{ 'bg-indigo-50 text-indigo-700' if active == 'personal' else 'text-slate-600 hover:bg-slate-50' }}">
    Personal profile
  </a>
  {% for name, m in modules.items() %}
    <a href="{{ url_for('profile.list_items', module_name=name) }}"
       class="block px-3 py-2 rounded-lg text-sm font-medium {{ 'bg-indigo-50 text-indigo-700' if active == name else 'text-slate-600 hover:bg-slate-50' }}">
      {{ m.title }}
    </a>
  {% endfor %}
</nav>
